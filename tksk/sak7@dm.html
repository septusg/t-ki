<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usagi Comic Reader</title>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@100;400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:     #090d14;
    --bg2:    #0f1520;
    --bg3:    #161e2e;
    --border: #1e2d45;
    --accent: #5b9bd5;
    --acc2:   #3a72a8;
    --text:   #d4e4f7;
    --text2:  #7a9fc0;
    --text3:  #3d5a78;
    --danger: #c4614a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'LINE Seed JP', sans-serif; min-height: 100vh; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── PAGES ── */
  .page { display: none; min-height: 100vh; }
  .page.active { display: block; }
  #page-login { align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(ellipse at 35% 45%, #0d1a2e 0%, #090d14 65%); }
  #page-login.active { display: flex; }

  /* ── LOGIN ── */
  .login-box { width: 360px; padding: 48px 40px; border: 1px solid var(--border); background: var(--bg2); position: relative; }
  .login-box::before { content: ''; position: absolute; top: -1px; left: 20px; right: 20px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  .login-title { font-family: 'LINE Seed JP', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 6px; text-align: center; }
  .login-sub { text-align: center; color: var(--text3); font-size: 11px; letter-spacing: 0.12em; margin-bottom: 32px; }
  .login-tabs { display: flex; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .login-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13px; color: var(--text3); letter-spacing: 0.08em; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
  .login-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .login-tab:hover { color: var(--text2); }
  .pw-input-wrap { margin-bottom: 14px; }
  .pw-input-wrap input { width: 100%; padding: 12px 16px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 14px; outline: none; letter-spacing: 0.2em; transition: border-color 0.2s; }
  .pw-input-wrap input:focus { border-color: var(--acc2); }
  .pw-input-wrap input::placeholder { letter-spacing: 0.05em; color: var(--text3); }
  .btn-login { width: 100%; padding: 13px; background: var(--accent); color: #090d14; border: none; cursor: pointer; font-family: 'LINE Seed JP', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.15em; transition: background 0.2s; }
  .btn-login:hover { background: #7ab3e0; }
  .login-error { color: var(--danger); font-size: 12px; text-align: center; margin-top: 10px; min-height: 18px; }

  /* ── NAV ── */
  .site-nav { position: sticky; top: 0; z-index: 100; background: rgba(9,13,20,0.97); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; height: 56px; gap: 0; }
  .nav-logo { font-family: 'LINE Seed JP', sans-serif; font-weight: 800; font-size: 17px; color: var(--accent); letter-spacing: 0.1em; cursor: pointer; margin-right: auto; }
  .nav-btn { padding: 6px 14px; font-size: 12px; letter-spacing: 0.08em; color: var(--text3); cursor: pointer; border: none; background: none; font-family: inherit; transition: color 0.2s; }
  .nav-btn:hover { color: var(--accent); }
  .nav-btn.active { color: var(--accent); }
  .nav-sep { color: var(--border); margin: 0 2px; font-size: 11px; }

  /* ── ADMIN ── */
  .empty-hint { color: var(--text3); font-size: 13px; text-align: center; padding: 48px 0; border: 1px dashed var(--border); letter-spacing: 0.05em; }
  .admin-inner { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
  .admin-title { font-family: 'LINE Seed JP', sans-serif; font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 28px; letter-spacing: 0.12em; }
  .admin-section { margin-bottom: 40px; }
  .admin-section-title { font-size: 11px; letter-spacing: 0.14em; color: var(--text3); margin-bottom: 16px; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .field-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 0; }
  .field label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.2s; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--acc2); }
  .field textarea { min-height: 80px; resize: vertical; }
  select option { background: var(--bg3); }
  .btn { padding: 9px 20px; font-size: 12px; letter-spacing: 0.08em; cursor: pointer; font-family: inherit; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #090d14; }
  .btn-primary:hover { background: #7ab3e0; }
  .btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--acc2); color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .btn-sm { padding: 5px 12px; font-size: 11px; }
  .work-list-item { border: 1px solid var(--border); background: var(--bg2); margin-bottom: 10px; overflow: hidden; }
  .work-list-header { display: flex; align-items: center; cursor: pointer; gap: 10px; }
  .work-list-header:hover { background: var(--bg3); }
  /* cover thumbnail in admin list */
  .work-list-cover { width: 48px; height: 48px; flex-shrink: 0; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .work-list-cover img { width: 100%; height: 100%; object-fit: cover; }
  .work-list-cover-ph { font-size: 18px; color: var(--border); font-family: 'LINE Seed JP', sans-serif; }
  .work-list-toggle { padding: 14px 0 14px 14px; color: var(--text3); transition: transform 0.2s; font-size: 11px; }
  .work-list-toggle.open { transform: rotate(90deg); }
  .work-list-name { flex: 1; font-size: 14px; padding: 14px 0; }
  .work-list-type { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }
  .work-list-actions { display: flex; gap: 6px; padding: 0 14px; }
  .work-list-body { padding: 0 16px 16px; border-top: 1px solid var(--border); }

  .admin-work-tabs { display:flex; gap:8px; margin: 10px 0 12px; }
  .admin-work-tab { padding: 6px 12px; font-size: 11px; letter-spacing: 0.08em; cursor: pointer; border: 1px solid var(--border); background: var(--bg3); color: var(--text3); font-family: inherit; transition: all 0.2s; }
  .admin-work-tab:hover { border-color: var(--acc2); color: var(--text2); }
  .admin-work-tab.active { border-color: var(--accent); color: var(--accent); }
  .drag-handle { padding: 14px 6px 14px 10px; color: var(--text3); cursor: grab; user-select: none; }
  .work-list-item.dragging { opacity: 0.55; }
  .work-list-item.drag-over { outline: 1px dashed var(--acc2); }
  .chapter-edit-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--bg3); }
  .chapter-edit-name { flex: 1; font-size: 13px; color: var(--text2); }
  .chapter-edit-count { font-size: 11px; color: var(--text3); }
  .pw-settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .toast { position: fixed; bottom: 24px; right: 24px; z-index: 9999; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all 0.3s; pointer-events: none; letter-spacing: 0.05em; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: var(--accent); }
  .toast.error { border-color: var(--danger); }

  .modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 32px; }
  .modal-title { font-family: 'LINE Seed JP', sans-serif; font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 24px; letter-spacing: 0.08em; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }

  @media(max-width:480px){ .pw-settings{grid-template-columns:1fr;} }

  /* ── Markdown Editor ── */
  .md-toolbar { display: flex; gap: 4px; padding: 6px 0; flex-wrap: wrap; }
  .md-toolbar button { padding: 4px 10px; font-size: 12px; background: var(--bg); border: 1px solid var(--border); color: var(--text2); cursor: pointer; font-family: monospace; transition: all 0.2s; line-height: 1.4; }
  .md-toolbar button:hover { border-color: var(--acc2); color: var(--accent); }
  .md-preview-box { min-height: 120px; max-height: 400px; overflow-y: auto; padding: 12px; background: var(--bg); border: 1px solid var(--border); font-size: 14px; color: var(--text2); line-height: 1.9; }
  .md-preview-box:empty::before { content: '預覽區（輸入內容後即時顯示）'; color: var(--text3); font-size: 12px; }
  .md-preview-box h1 { font-size: 20px; font-weight: 800; color: var(--text); margin: 12px 0 8px; font-family: 'LINE Seed JP', sans-serif; }
  .md-preview-box h2 { font-size: 17px; font-weight: 800; color: var(--text); margin: 10px 0 6px; font-family: 'LINE Seed JP', sans-serif; }
  .md-preview-box h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 8px 0 4px; }
  .md-preview-box p { margin-bottom: 8px; }
  .md-preview-box strong { color: var(--text); }
  .md-preview-box em { font-style: italic; }
  .md-preview-box del { color: var(--text3); }
  .md-preview-box code { background: var(--bg3); padding: 2px 6px; font-family: monospace; font-size: 12px; color: var(--accent); border-radius: 2px; }
  .md-preview-box pre { background: var(--bg3); border: 1px solid var(--border); padding: 12px; margin: 8px 0; overflow-x: auto; border-radius: 2px; }
  .md-preview-box pre code { background: none; padding: 0; }
  .md-preview-box img { display: block; max-width: 100%; margin: 8px 0; border: 1px solid var(--border); }
  .md-preview-box hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .md-preview-box ul, .md-preview-box ol { padding-left: 20px; margin-bottom: 8px; }
  .md-preview-box li { margin-bottom: 4px; }
  .md-preview-box .spoiler-text { background: var(--text3); color: transparent; cursor: pointer; padding: 2px 6px; border-radius: 2px; user-select: none; transition: all 0.2s; }
  .md-preview-box .spoiler-text.revealed { color: var(--text); background: var(--bg3); }
  .md-preview-box .spoiler-img { position: relative; cursor: pointer; margin: 8px 0; overflow: hidden; }
  .md-preview-box .spoiler-img img { display: block; max-width: 100%; filter: blur(20px) brightness(0.5); transition: filter 0.3s; border: 1px solid var(--border); }
  .md-preview-box .spoiler-img.revealed img { filter: none; }
  .md-preview-box .spoiler-img .spoiler-cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.4); color: var(--text3); font-size: 13px; letter-spacing: 0.1em; transition: opacity 0.3s; }
  .md-preview-box .spoiler-img.revealed .spoiler-cover { opacity: 0; pointer-events: none; }
  a.nav-btn { text-decoration: none; }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="page-login" class="page active">
  <div class="login-box">
    <div class="login-title">Usagi Comic Reader</div>
    <div class="login-sub">PRIVATE READING ROOM</div>
    <div class="login-tabs">
      <div class="login-tab active" onclick="selectLoginTab('admin',this)">管理</div>
    </div>
    <div class="pw-input-wrap">
      <input type="password" id="pw-input" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-login" onclick="doLogin()">進入</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ ADMIN ══ -->
<div id="page-admin" class="page">
  <nav class="site-nav">
    <div class="nav-logo">Usagi</div>
    <a class="nav-btn" href="index.html#library=manga" target="_blank">漫畫</a>
    <span class="nav-sep">·</span>
    <a class="nav-btn" href="index.html#library=illust" target="_blank">插圖</a>
    <span class="nav-sep">·</span>
    <button class="nav-btn active" onclick="showPage('admin')">管理</button>
    <button class="nav-btn" onclick="logout()" style="margin-left:auto">登出</button>
  </nav>
  <div class="admin-inner">
    <div class="admin-title">管 理 後 台</div>
    <div class="admin-section">
      <div class="admin-section-title">密碼設定</div>
      <div class="pw-settings">
        <div class="field"><label>漫畫區密碼</label><input type="password" id="pw-manga-new" placeholder="輸入新密碼（留空不改）"></div>
        <div class="field"><label>插圖區密碼</label><input type="password" id="pw-illust-new" placeholder="輸入新密碼（留空不改）"></div>
      </div>
      <div style="margin-top:10px"><div class="field" style="max-width:260px"><label>管理員密碼</label><input type="password" id="pw-admin-new" placeholder="輸入新密碼（留空不改）"></div></div>
      <button class="btn btn-primary" style="margin-top:12px" onclick="savePasswords()">儲存密碼</button>
    </div>
    <div class="admin-section">
      <div class="admin-section-title" style="display:flex;align-items:center;justify-content:space-between">
        <span>作品管理</span>
        <button class="btn btn-primary btn-sm" onclick="openAddWork()">+ 新增作品</button>
      </div>
      <div class="admin-work-tabs">
        <button class="admin-work-tab active" id="admin-tab-manga" onclick="setAdminWorkTab('manga')">漫畫</button>
        <button class="admin-work-tab" id="admin-tab-illust" onclick="setAdminWorkTab('illust')">插畫</button>
      </div>
      <div id="admin-work-list"></div>
    </div>
    <div class="admin-section">
      <div class="admin-section-title">資料備份</div>
      <div class="field-row">
        <button class="btn btn-secondary" onclick="exportData()">匯出 JSON</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">匯入 JSON</button>
        <button class="btn btn-secondary" onclick="updateJSON()">更新JSON</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.8">資料儲存於瀏覽器 localStorage。建議定期匯出備份以防資料遺失。</div>
    </div>
  </div>
</div>

<!-- ══ MODAL: 新增/編輯作品 ══ -->
<div class="modal-overlay" id="modal-work">
  <div class="modal">
    <div class="modal-title" id="modal-work-title">新增作品</div>
    <div class="field-row">
      <div class="field"><label>作品標題</label><input type="text" id="m-work-title" placeholder="作品名稱"></div>
      <div class="field" style="max-width:120px">
        <label>分類</label>
        <select id="m-work-type" onchange="toggleReadMode()">
          <option value="manga">漫畫</option>
          <option value="illust">插圖</option>
        </select>
      </div>
    </div>
    <div class="field" id="read-mode-field">
      <label>閱讀方式</label>
      <select id="m-work-readmode">
        <option value="strip">條漫（垂直滾動）</option>
        <option value="paged">頁漫（從右至左翻頁）</option>
      </select>
    </div>
    <div class="field"><label>作品封面 URL（選填）</label><input type="text" id="m-work-cover" placeholder="https://..."></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-work')">取消</button>
      <button class="btn btn-primary" onclick="saveWork()">儲存</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: 新增/編輯漫畫話數 ══ -->
<div class="modal-overlay" id="modal-chapter">
  <div class="modal">
    <div class="modal-title" id="modal-chapter-title">新增話數</div>
    <div class="field"><label>話數標題</label><input type="text" id="m-ch-title" placeholder="例：第1話、番外篇"></div>
    <div class="field" style="margin-top:10px"><label>話數封面圖 URL（選填）</label><input type="text" id="m-ch-cover" placeholder="https://...（留空則用第一張圖）"></div>
	<div class="field" style="margin-top:10px">
  <label>閱讀模式（預設跟隨作品）</label>
  <select id="m-ch-readmode">
    <option value="">跟隨作品設定</option>
    <option value="strip">條漫</option>
    <option value="paged">頁漫</option>
  </select>
</div>
    <div style="margin-top:14px;margin-bottom:6px;font-size:11px;color:var(--text3);letter-spacing:0.06em">圖片 URL 列表（每行一張，<span style="color:var(--accent)">||URL||</span> = 爆雷圖片）</div>
    <div style="margin-bottom:6px"><button type="button" class="btn btn-secondary btn-sm" onclick="toggleChSpoiler()" title="將選取的 URL 加上/移除 || 爆雷標記">爆雷切換</button></div>
    <div class="field"><textarea id="m-ch-images" placeholder="https://example.com/p001.jpg&#10;||https://example.com/spoiler.jpg||&#10;https://example.com/p003.jpg" style="min-height:160px;font-family:monospace;font-size:12px"></textarea></div>
    <div class="field-row" style="margin-top:10px;align-items:center">
      <input type="file" id="m-ch-files" accept="image/*" multiple style="display:none" onchange="uploadPickedFiles(this,'m-ch-images','manga')">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('m-ch-files').click()">從本機選圖並上傳</button>
      <div id="m-ch-upload-status" style="font-size:11px;color:var(--text3)"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-chapter')">取消</button>
      <button class="btn btn-primary" onclick="saveChapter()">儲存</button>
    </div>
  </div>
</div>

<!-- ══ MODAL: 新增/編輯插圖貼文 ══ -->
<div class="modal-overlay" id="modal-post">
  <div class="modal">
    <div class="modal-title" id="modal-post-title">新增貼文</div>
    <div class="field"><label>貼文標題</label><input type="text" id="m-post-title" placeholder="這篇文章的標題"></div>
    <div class="field" style="margin-top:10px"><label>封面圖 URL（選填，留空自動用第一張圖）</label><input type="text" id="m-post-cover" placeholder="https://..."></div>
    
    <div style="margin-top:14px">
      <div style="font-size:11px;color:var(--text3);letter-spacing:0.06em;margin-bottom:2px">文章內文（支援 Markdown）</div>
      <div class="md-toolbar">
        <button type="button" title="粗體 **text**" onclick="insertMd('**','**')"><b>B</b></button>
        <button type="button" title="斜體 *text*" onclick="insertMd('*','*')"><i>I</i></button>
        <button type="button" title="刪除線 ~~text~~" onclick="insertMd('~~','~~')"><s>S</s></button>
        <button type="button" title="標題" onclick="insertMd('# ','')">H</button>
        <button type="button" title="行內程式碼" onclick="insertMd('\x60','\x60')">code</button>
        <button type="button" title="程式碼區塊" onclick="insertCodeBlock()">```</button>
        <button type="button" title="爆雷 ||text||" onclick="insertMd('||','||')">爆雷</button>
        <button type="button" title="清單" onclick="insertMd('- ','')">• list</button>
        <button type="button" title="分隔線" onclick="insertMdLine('---')">───</button>
      </div>
    </div>
    <div class="field"><textarea id="m-post-body" oninput="updatePostPreview()" placeholder="支援 Markdown 語法&#10;&#10;圖片 URL 單獨一行 → 顯示為圖片&#10;||URL|| → 爆雷圖片（點擊才顯示）&#10;||文字|| → 爆雷文字&#10;``` → 程式碼區塊" style="min-height:180px;line-height:1.8;font-family:monospace;font-size:12px"></textarea>
    <div class="field-row" style="margin-top:10px;align-items:center">
      <input type="file" id="m-post-files" accept="image/*" multiple style="display:none" onchange="uploadPickedFiles(this,'m-post-body','illust')">
      <button class="btn btn-secondary btn-sm" onclick="document.getElementById('m-post-files').click()">從本機選圖並上傳</button>
      <div id="m-post-upload-status" style="font-size:11px;color:var(--text3)"></div>
    </div></div>
    <div style="margin-top:12px">
      <div style="font-size:11px;color:var(--text3);letter-spacing:0.06em;margin-bottom:6px">即時預覽</div>
      <div class="md-preview-box" id="m-post-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('modal-post')">取消</button>

<script>

let STATE = {

function loadLocalData() {
  const saved = localStorage.getItem('manga-gallery-data');
  if (!saved) return null;
  try { return JSON.parse(saved); } catch(e) { return null; }
}

async function loadRemoteData() {
  try {
    const r = await fetch('data.json?ts=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const d = await r.json();
    if (d && Array.isArray(d.works)) return d;
  } catch(e) {}
  return null;
}

async function init() {
  const remote = await loadRemoteData();
  if (remote && remote.works) STATE.works = remote.works;

  const local = loadLocalData();
  if (local) {
    if (local.passwords) STATE.passwords = { ...STATE.passwords, ...local.passwords };
    if (!remote && local.works) STATE.works = local.works;

  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });

}

function setAdminWorkTab(t) {
  STATE.adminWorkTab = t;

  if (a) a.classList.toggle('active', t === 'manga');

function reorderWorksWithinType(type, orderedIds) {
  const idxs = [];
  const byId = {};
  STATE.works.forEach((w, i) => { if (w.type === type) { idxs.push(i); byId[w.id] = w; } });
  const next = orderedIds.map(id => byId[id]).filter(Boolean);
  if (next.length !== idxs.length) return;
  for (let i = 0; i < idxs.length; i++) STATE.works[idxs[i]] = next[i];
}

function setupWorkDnD() {
  const list = document.getElementById('admin-work-list');
  if (!list) return;

  let draggingId = null;

  const items = list.querySelectorAll('.work-list-item');
  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    const id = item.getAttribute('data-work-id');
    const handle = item.querySelector('.drag-handle');
    if (!id || !handle) continue;

    handle.setAttribute('draggable', 'true');

    handle.addEventListener('dragstart', (e) => {
      draggingId = id;
      item.classList.add('dragging');
      try { e.dataTransfer.setData('text/plain', id); } catch(err) {}
      e.dataTransfer.effectAllowed = 'move';
    });

    handle.addEventListener('dragend', () => {
      draggingId = null;
      item.classList.remove('dragging');
      const all = list.querySelectorAll('.work-list-item');
      for (let k = 0; k < all.length; k++) all[k].classList.remove('drag-over', 'dragging');
    });

    item.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggingId || draggingId === id) return;
      item.classList.add('drag-over');
      e.dataTransfer.dropEffect = 'move';
    });

    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));

    item.addEventListener('drop', (e) => {
      e.preventDefault();
      item.classList.remove('drag-over');

      const fromId = draggingId || (() => { try { return e.dataTransfer.getData('text/plain'); } catch(err) { return ''; } })();
      const toId = id;
      if (!fromId || !toId || fromId === toId) return;

      const type = STATE.adminWorkTab || 'manga';
      const cur = STATE.works.filter(w => w.type === type).map(w => w.id);
      const fromIdx = cur.indexOf(fromId);
      const toIdx = cur.indexOf(toId);
      if (fromIdx < 0 || toIdx < 0) return;

      cur.splice(fromIdx, 1);
      cur.splice(toIdx, 0, fromId);

      reorderWorksWithinType(type, cur);
      save();
      renderAdmin();
      toast('已調整順序（記得按「更新JSON」）');
    });
  }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function openModal(id) { document.getElementById(id).classList.add('open'); }

// ══════════════════════════════════════════
// MARKDOWN EDITOR
// ══════════════════════════════════════════
function parseMd(text) {
  if (!text) return '';
  var lines = text.split('\n');
  var html = '';
  var inCode = false;
  var codeBuf = '';

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    // code block fence
    if (/^```/.test(line.trim())) {
      if (!inCode) {
        inCode = true;
        codeBuf = '';
      } else {
        html += '<pre><code>' + esc(codeBuf) + '</code></pre>';
        inCode = false;
      }
      continue;
    }

    if (inCode) {
      codeBuf += (codeBuf ? '\n' : '') + line;
      continue;
    }

    var t = line.trim();

    // empty line
    if (!t) { continue; }

    // horizontal rule
    if (/^(-{3,}|\*{3,})$/.test(t)) { html += '<hr>'; continue; }

    // spoiler image: ||URL||
    var sm = t.match(/^\|\|(https?:\/\/\S+)\|\|$/);
    if (sm) {
      html += '<div class="spoiler-img" onclick="this.classList.toggle(\'revealed\')">'
            + '<img src="' + esc(sm[1]) + '">'
            + '<div class="spoiler-cover">點擊顯示</div></div>';
      continue;
    }

    // plain image URL on its own line
    if (/^https?:\/\/\S+$/i.test(t)) {
      html += '<div class="post-block-img"><img src="' + esc(t) + '"></div>';
      continue;
    }

    // unordered list
    if (/^[-*] /.test(t)) { html += '<ul><li>' + inlineMd(t.replace(/^[-*] /, '')) + '</li></ul>'; continue; }

    // ordered list
    if (/^\d+\. /.test(t)) { html += '<ol><li>' + inlineMd(t.replace(/^\d+\. /, '')) + '</li></ol>'; continue; }

    // headers
    if (/^### /.test(t)) { html += '<h3>' + inlineMd(t.slice(4)) + '</h3>'; continue; }
    if (/^## /.test(t))  { html += '<h2>' + inlineMd(t.slice(3)) + '</h2>'; continue; }
    if (/^# /.test(t))   { html += '<h1>' + inlineMd(t.slice(2)) + '</h1>'; continue; }

    // paragraph
    html += '<p>' + inlineMd(t) + '</p>';
  }

  if (inCode) { html += '<pre><code>' + esc(codeBuf) + '</code></pre>'; }

  // merge consecutive <ul>/<ol> tags
  html = html.replace(/<\/ul><ul>/g, '');
  html = html.replace(/<\/ol><ol>/g, '');

  return html;
}

function inlineMd(text) {
  var s = esc(text);
  // inline code (handle first to protect contents)
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold **text**
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // italic *text*
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // strikethrough ~~text~~
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  // spoiler text ||text||
  s = s.replace(/\|\|(.+?)\|\|/g, '<span class="spoiler-text" onclick="this.classList.toggle(\'revealed\')">$1</span>');
  return s;
}

function insertMd(before, after) {
  var ta = document.getElementById('m-post-body');
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var val = ta.value;
  var selected = val.substring(start, end);
  var replacement = before + selected + after;
  ta.value = val.substring(0, start) + replacement + val.substring(end);
  ta.focus();
  var newStart = start + before.length;
  var newEnd = newStart + selected.length;
  ta.setSelectionRange(newStart, newEnd);
  updatePostPreview();
}

function insertMdLine(text) {
  var ta = document.getElementById('m-post-body');
  var start = ta.selectionStart;
  var val = ta.value;
  var before = val.substring(0, start);
  var after = val.substring(start);
  var prefix = (before.length && before.charAt(before.length - 1) !== '\n') ? '\n' : '';
  var suffix = (after.length && after.charAt(0) !== '\n') ? '\n' : '';
  var insert = prefix + text + suffix;
  ta.value = before + insert + after;
  ta.focus();
  var pos = start + insert.length;
  ta.setSelectionRange(pos, pos);
  updatePostPreview();
}

function insertCodeBlock() {
  var ta = document.getElementById('m-post-body');
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var val = ta.value;
  var selected = val.substring(start, end);
  var replacement = '```\n' + selected + '\n```';
  ta.value = val.substring(0, start) + replacement + val.substring(end);
  ta.focus();
  var pos = start + 4;
  ta.setSelectionRange(pos, pos + selected.length);
  updatePostPreview();
}

function updatePostPreview() {
  var body = document.getElementById('m-post-body').value;
  var preview = document.getElementById('m-post-preview');
  if (preview) preview.innerHTML = parseMd(body);
}

function toggleChSpoiler() {
  var ta = document.getElementById('m-ch-images');
  var start = ta.selectionStart;
  var end = ta.selectionEnd;
  var val = ta.value;
  // expand selection to full lines
  while (start > 0 && val.charAt(start - 1) !== '\n') start--;
  while (end < val.length && val.charAt(end) !== '\n') end++;
  var selected = val.substring(start, end);
  var lines = selected.split('\n');
  var toggled = lines.map(function(line) {
    var t = line.trim();
    if (!t) return line;
    if (/^\|\|/.test(t) && /\|\|$/.test(t)) {
      return t.replace(/^\|\|/, '').replace(/\|\|$/, '');
    } else {
      return '||' + t + '||';
    }
  });
  ta.value = val.substring(0, start) + toggled.join('\n') + val.substring(end);
  ta.focus();
  ta.setSelectionRange(start, start + toggled.join('\n').length);
}

init();

// ══════════════════════════════════════════
// FILE UPLOAD (local -> Worker -> GitHub -> URL)
// ══════════════════════════════════════════
async function uploadPickedFiles(inp, targetId, kind) {
  const files = Array.prototype.slice.call(inp.files || []);
  inp.value = '';
  if (!files.length) return;

  if (!UPLOAD_API || UPLOAD_API.indexOf('YOUR_WORKER_SUBDOMAIN') >= 0) { toast('請先設定 UPLOAD_API', 'error'); return; }

  const statusId = targetId === 'm-ch-images' ? 'm-ch-upload-status' : 'm-post-upload-status';
  const statusEl = document.getElementById(statusId);
  statusEl.textContent = '上傳中…';

  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    try {
      const url = await uploadOneFile(f, kind);
      appendLine(targetId, url);
      ok++;
      statusEl.textContent = '已上傳 ' + ok + ' / ' + files.length;
    } catch (e) {
      statusEl.textContent = '上傳失敗：' + (e && e.message ? e.message : e);
      toast('上傳失敗：' + f.name, 'error');
      return;
    }
  }
  statusEl.textContent = '完成';
  toast('已上傳 ' + ok + ' 張', 'success');
}

function appendLine(targetId, line) {
  const el = document.getElementById(targetId);
  const cur = el.value.trim();
  el.value = cur ? (cur + '\\n' + line) : line;
}

async function uploadOneFile(file, kind) {
  const fd = new FormData();
  fd.append('file', file, file.name);
  fd.append('kind', kind);
  fd.append('site', UPLOAD_SITE_BASE);

  const r = await fetch(UPLOAD_API, { method: 'POST', body: fd });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (!j || !j.url) throw new Error('NO_URL');
  return j.url;
}

async function pushPublicData() {
  const payload = { version: 1, works: STATE.works };
  const r = await fetch(SAVE_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json().catch(() => ({}));
}
