<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usagi Comic Reader</title>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@100;400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* 共用樣式在 common.css，這裡只放前台專用的 */
  img { -webkit-touch-callout: none; }

  /* ── NAV（前台專用）── */
  .nav-btn.locked { color: var(--text3); opacity: 0.5; }
  .nav-btn.locked::after { content: ' 🔒'; font-size: 10px; }
  .nav-user { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .nav-avatar { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); object-fit: cover; }
  .nav-username { font-size: 11px; color: var(--text2); max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media(max-width:480px){ .nav-username { display: none; } }

  /* ── LIBRARY ── */
  .page-inner { padding: 40px 24px; max-width: 1000px; margin: 0 auto; }
  .section-header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .section-title { font-family: 'LINE Seed JP', sans-serif; font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: 0.1em; }
  .section-count { font-size: 12px; color: var(--text3); }
  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 48px; }
  .work-card { cursor: pointer; border: 1px solid var(--border); background: var(--bg2); overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
  .work-card:hover { border-color: var(--acc2); transform: translateY(-2px); }
  .work-cover { aspect-ratio: 3/4; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .work-cover img { width: 100%; height: 100%; object-fit: cover; }
  .work-cover-placeholder { font-family: 'LINE Seed JP', sans-serif; font-size: 36px; color: var(--border); }
  .work-info { padding: 12px; }
  .work-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .work-meta { font-size: 11px; color: var(--text3); }

  /* ── WORK DETAIL ── */
  .work-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 32px 24px 28px; }
  .work-header-inner { max-width: 800px; margin: 0 auto; }
  .breadcrumb { font-size: 12px; color: var(--text3); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--accent); }
  .work-big-title { font-family: 'LINE Seed JP', sans-serif; font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: 0.05em; margin-bottom: 8px; }
  .work-type-badge { display: inline-block; padding: 3px 10px; border: 1px solid var(--border); font-size: 11px; color: var(--text3); letter-spacing: 0.08em; }
  .chapter-list { max-width: 800px; margin: 0 auto; padding: 32px 24px; }

  /* chapter card with cover */
  .chapter-item { display: flex; align-items: center; margin-bottom: 8px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; transition: border-color 0.2s, background 0.2s; overflow: hidden; }
  .chapter-item:hover { border-color: var(--acc2); background: var(--bg3); }
  .chapter-thumb { width: 72px; height: 72px; flex-shrink: 0; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .chapter-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .chapter-thumb-placeholder { font-size: 22px; color: var(--border); font-family: 'LINE Seed JP', sans-serif; }
  .chapter-info { flex: 1; padding: 14px 18px; }
  .chapter-num { font-family: 'LINE Seed JP', sans-serif; font-size: 18px; font-weight: 800; color: var(--acc2); margin-bottom: 2px; }
  .chapter-name { font-size: 14px; color: var(--text); }
  .chapter-count { font-size: 11px; color: var(--text3); margin-top: 3px; }

  /* ── ILLUST POST LIST (article style) ── */
  .post-list { max-width: 720px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .post-list-item { border: 1px solid var(--border); background: var(--bg2); cursor: pointer; transition: border-color 0.2s, transform 0.15s; display: flex; overflow: hidden; }
  .post-list-item:hover { border-color: var(--acc2); transform: translateY(-1px); }
  .post-list-cover { width: 140px; height: 100px; flex-shrink: 0; background: var(--bg3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .post-list-cover img { width: 100%; height: 100%; object-fit: cover; }
  .post-list-cover-ph { font-size: 28px; color: var(--border); }
  .post-list-body { flex: 1; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; }
  .post-list-title { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .post-list-excerpt { font-size: 12px; color: var(--text3); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .post-list-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  @media(max-width:480px) { .post-list-cover { width: 100px; height: 80px; } }

  /* ── VIEWER ── */
  #page-viewer { background: #000; overflow-x: hidden; }
  .viewer-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #1a2a40; display: flex; align-items: center; padding: 0 16px; height: 52px; gap: 8px; transform: translateY(0); transition: transform 0.3s; }
  .viewer-nav.hidden { transform: translateY(-100%); }
  .viewer-title { flex: 1; font-size: 13px; color: #6a8fa8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-close { padding: 5px 12px; font-size: 11px; color: #4a6a85; cursor: pointer; border: none; background: none; font-family: inherit; transition: color 0.2s; }
  .viewer-close:hover { color: #7ab3e0; }
  .viewer-mode-label { font-size: 11px; color: #3a5a75; letter-spacing: 0.1em; border: 1px solid #1a2a40; padding: 4px 10px; }
  .viewer-strip { padding-top: 0; }
  .strip-img { display: block; width: 100%; max-width: 720px; margin: 0 auto; }
  .seq-hidden { opacity: 0; transition: opacity 0.3s; }
  .seq-visible { opacity: 1; }
    /* ── PAGED VIEWER — scroll-snap carousel ── */
  .paged-carousel {
    position: fixed; inset: 0; top: 0;
    display: flex;
    overflow-x: scroll;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    background: #000;
  }
  .paged-carousel.rtl { flex-direction: row-reverse; }
  .paged-carousel::-webkit-scrollbar { display: none; }
  .paged-slide {
    flex: 0 0 100vw;
    width: 100vw;
    height: 100vh;
    scroll-snap-align: start;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .paged-slide img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    user-select: none; -webkit-user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    draggable: false;
  }
  @media(max-width:768px) {
    .paged-carousel { gap: 0; }
    .paged-slide {
      flex: 0 0 100%;
      width: 100%;
      min-width: 100%;
      margin: 0;
      padding: 0;
      background: #000;
    }
    .paged-slide img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      max-height: none;
      margin: 0;
      padding: 0;
      object-fit: fill;
      background: #000;
    }
  }
  .paged-counter-overlay {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #6a8fa8;
    font-size: 12px; padding: 4px 14px; border-radius: 20px;
    pointer-events: none; z-index: 201; letter-spacing: 0.06em;
    transition: opacity 0.25s;
  }
  .paged-counter-overlay.arr-hidden { opacity: 0; }

  .paged-arrow {
    position: fixed; top: 50%; z-index: 220;
    transform: translateY(-50%);
    width: 52px; height: 88px;
    background: rgba(0,0,0,0.35);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: rgba(255,255,255,0.65);
    transition: opacity 0.25s, background 0.2s, color 0.2s;
    user-select: none; -webkit-user-select: none;
  }
  .paged-arr-left  { left:  0; border-radius: 0 6px 6px 0; }
  .paged-arr-right { right: 0; border-radius: 6px 0 0 6px; }
  .paged-arrow:hover { background: rgba(0,0,0,0.62); color: #fff; }
  .paged-arrow.arr-end    { opacity: 0.15 !important; pointer-events: none !important; }
  .paged-arrow.arr-hidden { opacity: 0   !important; pointer-events: none !important; }/* illust post article viewer */
  .post-article { max-width: 720px; margin: 0 auto; padding: 32px 0 60px; overflow-x: hidden; }
  .post-article-title { font-family: 'LINE Seed JP', sans-serif; font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 8px; line-height: 1.4; padding: 0 24px; }
  .post-article-meta { font-size: 12px; color: var(--text3); margin-bottom: 28px; padding: 0 24px 16px; border-bottom: 1px solid var(--border); }
  /* text block */
  .post-block-text { font-size: 14px; color: var(--text2); line-height: 1.9; white-space: pre-wrap; margin-bottom: 20px; padding: 0 24px; }
  /* image block */
  .post-block-img { margin-bottom: 0; }
  .post-block-img img { display: block; width: 100%; border: none; transition: opacity 0.2s; }
  .post-block-img img:hover { opacity: 0.9; }
  /* multi-image grid */
  .post-block-imgs { display: grid; gap: 4px; margin-bottom: 12px; padding: 0 24px; }
  .post-block-imgs.cols-2 { grid-template-columns: 1fr 1fr; }
  .post-block-imgs.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .post-block-imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--border); transition: opacity 0.2s; }
  .post-block-imgs img:hover { opacity: 0.9; }


  /* ── Spoiler（共用部分在 common.css）── */
  .strip-spoiler { margin: 0 auto; max-width: 720px; }
  .strip-spoiler img.strip-img { filter: blur(20px) brightness(0.5); transition: filter 0.3s; }
  .strip-spoiler.revealed img.strip-img { filter: none; }
  .paged-spoiler { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .paged-spoiler img { max-width: 100%; max-height: 100%; object-fit: contain; }

  /* ── Markdown in Viewer ── */
  .md-content h1 { font-size: 20px; font-weight: 800; color: var(--text); margin: 12px 0 8px; font-family: 'LINE Seed JP', sans-serif; padding: 0 24px; }
  .md-content h2 { font-size: 17px; font-weight: 800; color: var(--text); margin: 10px 0 6px; font-family: 'LINE Seed JP', sans-serif; padding: 0 24px; }
  .md-content h3 { font-size: 15px; font-weight: 700; color: var(--text); margin: 8px 0 4px; padding: 0 24px; }
  .md-content p { margin-bottom: 8px; font-size: 14px; color: var(--text2); line-height: 1.9; padding: 0 24px; }
  .md-content strong { color: var(--text); }
  .md-content em { font-style: italic; }
  .md-content del { color: var(--text3); }
  .md-content code { background: var(--bg3); padding: 2px 6px; font-family: monospace; font-size: 12px; color: var(--accent); border-radius: 2px; }
  .md-content pre { background: var(--bg3); border: 1px solid var(--border); padding: 12px; margin: 8px 24px; overflow-x: auto; border-radius: 2px; }
  .md-content pre code { background: none; padding: 0; }
  .md-content img { display: block; width: 100%; margin: 0; border: none; }
  .md-content .spoiler-img { width: 100%; }
  .md-content .spoiler-img img { cursor: default; }
  .md-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 24px; }
  .md-content ul, .md-content ol { padding-left: 44px; padding-right: 24px; margin-bottom: 8px; }
  .md-content li { margin-bottom: 4px; font-size: 14px; color: var(--text2); line-height: 1.9; }

  .reveal { opacity: 0; transform: translateY(10px); transition: opacity 0.35s, transform 0.35s; }
  .reveal.visible { opacity: 1; transform: none; }
  @media(max-width:480px){ .works-grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="page-login" class="page active">
  <div class="login-box">
    <div class="login-title">Usagi Comic Reader</div>
    <div class="login-sub">PRIVATE READING ROOM</div>
    <button class="btn-login" onclick="doLogin()" style="margin-top:16px">使用 Google 登入</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ LIBRARY ══ -->
<div id="page-library" class="page">
  <nav class="site-nav">

    <button class="nav-btn" id="nav-manga" onclick="navClickSection('manga')">漫畫</button>

    <div class="nav-user">
      <img class="nav-avatar" id="nav-avatar" src="" style="display:none">
      <span class="nav-username" id="nav-username"></span>
      <button class="nav-btn" onclick="logout()">登出</button>
    </div>
  </nav>
  <div class="page-inner">
    <div id="manga-section">
      <div class="section-header">
        <div class="section-title">漫畫</div>
        <div class="section-count" id="manga-count"></div>
      </div>
      <div class="works-grid" id="manga-grid"></div>
    </div>
    <div id="illust-section">
      <div class="section-header">
        <div class="section-title">插圖</div>
        <div class="section-count" id="illust-count"></div>
      </div>
      <div class="works-grid" id="illust-grid"></div>
    </div>
  </div>
</div>

<!-- ══ WORK DETAIL ══ -->
<div id="page-work" class="page">
  <nav class="site-nav">
    <div class="nav-logo" onclick="goHome()">Usagi</div>
    <button class="nav-btn" onclick="goBack()">← 返回</button>
    <div class="nav-user">
      <img class="nav-avatar nav-avatar-sub" src="" style="display:none">
      <button class="nav-btn" onclick="logout()">登出</button>
    </div>
  </nav>
  <div class="work-header">
    <div class="work-header-inner">
      <div class="breadcrumb">
        <span onclick="goHome()">首頁</span><span>›</span>
        <span id="work-section-label"></span><span>›</span>
        <span id="work-breadcrumb-title"></span>
      </div>
      <div class="work-big-title" id="work-detail-title"></div>
      <div class="work-type-badge" id="work-type-badge"></div>
    </div>
  </div>
  <div class="chapter-list" id="chapter-list"></div>
</div>

<!-- ══ VIEWER ══ -->
<div id="page-viewer" class="page">
  <div class="viewer-nav" id="viewer-nav">
    <button class="viewer-close" onclick="goBack()">← 返回</button>
    <div class="viewer-title" id="viewer-title"></div>
    <div class="viewer-mode-label" id="viewer-mode-label"></div>
  </div>
  <button id="paged-arr-prev" class="paged-arrow paged-arr-right" onclick="event.stopPropagation();pagedNav(-1)" style="display:none">&#8250;</button>
  <button id="paged-arr-next" class="paged-arrow paged-arr-left"  onclick="event.stopPropagation();pagedNav(1)"  style="display:none">&#8249;</button>
  <div id="viewer-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
// AUTH_API、callApi、showPage、esc、toast、parseMd 等共用函式在 common.js
const BLOCKED_MSG = '禁止閱覽未開通內容，請聯繫作者';

let STATE = {
  // auth
  token: null,
  userEmail: null,
  userName: null,
  userPicture: null,
  // data
  works: [],
  viewerImages: [],    // flat array for manga
  viewerPosts: [],     // array of {images, caption} for illust post feed
  viewerMode: 'strip',
  viewerIndex: 0,
  viewerSpoilers: [],
  currentWorkId: null,
  ignoreHashChange: false,
};
const IS_MOBILE = (function() {
  try {
    if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
  } catch(e) {}
  try {
    return /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent || '');
  } catch(e) {}
  return false;
})();

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════

async function init() {
  // ── 處理 Google 登入回傳的 token ──
  STATE.token = initToken('auth_token');

  // ── 驗證 token ──
  if (STATE.token) {
    var me = await callApi('/auth/me', STATE.token);
    if (me.ok && me.data) {
      STATE.userEmail = me.data.email;
      STATE.userName = me.data.name;
      STATE.userPicture = me.data.picture;
      updateUserDisplay();
    } else {
      STATE.token = null;
      localStorage.removeItem('auth_token');
    }
  }

  // ── 載入資料 ──
  if (STATE.token) {
    var res = await callApi('/api/data', STATE.token);
    if (res.status === 401) logout();
    else if (res.ok && res.data && Array.isArray(res.data.works)) STATE.works = res.data.works;
    else toast('資料載入失敗：' + apiErrorText(res), 'error');
  }

  document.addEventListener('keydown', handleKey);
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  window.addEventListener('hashchange', function() {
    if (STATE.ignoreHashChange) {
      STATE.ignoreHashChange = false;
      return;
    }
    applyRoute();
  });
  applyRoute();
}

// 依序載入圖片：同時最多 IMG_CONCURRENCY 張，前面的頁先拿到頻寬
// （原本一打開就把整話全部發出去，幾十張一起搶頻寬，第 1 頁反而很晚才出來）
// 圖片 HTML 先放 data-src，由這裡依序換成 src；換話或離開閱讀頁就不再排下一張
const IMG_CONCURRENCY = 3;
let IMG_QUEUE_ID = 0;
function loadImagesInOrder(imgs) {
  const id = ++IMG_QUEUE_ID;
  const viewer = document.getElementById('page-viewer');
  let next = 0, active = 0;
  function pump() {
    while (active < IMG_CONCURRENCY && next < imgs.length && id === IMG_QUEUE_ID && viewer.classList.contains('active')) {
      const img = imgs[next++];
      active++;
      img.addEventListener('load', done);
      img.addEventListener('error', done);
      img.src = img.getAttribute('data-src');
    }
  }
  function done() { active--; pump(); }
  pump();
}

function bindSequentialReveal(container, selector) {
  var imgs = container.querySelectorAll(selector);
  if (!imgs.length) return;
  var loaded = [];
  var revealed = 0;
  for (var i = 0; i < imgs.length; i++) loaded[i] = false;
  function revealReady() {
    while (revealed < imgs.length && loaded[revealed]) {
      imgs[revealed].classList.remove('seq-hidden');
      imgs[revealed].classList.add('seq-visible');
      revealed++;
    }
  }
  for (var i = 0; i < imgs.length; i++) {
    (function(idx) {
      var img = imgs[idx];
      img.classList.add('seq-hidden');
      if (img.complete && img.naturalWidth > 0) {
        loaded[idx] = true;
        revealReady();
      } else {
        img.addEventListener('load', function() { loaded[idx] = true; revealReady(); });
        img.addEventListener('error', function() { loaded[idx] = true; revealReady(); });
      }
    })(i);
  }
}

function setRouteHash(hash) {
  if ((location.hash || '') === hash) return;
  STATE.ignoreHashChange = true;
  location.hash = hash;
}


function parseRoute() {
  const hash = (location.hash || '').replace(/^#/, '');
  let m = null;

  if (!hash || hash === 'home') return { page: 'home' };
  if (hash === 'library=manga') return { page: 'library', section: 'manga' };
  if (hash === 'library=illust') return { page: 'library', section: 'illust' };

  m = /^manga-work=(.+)$/.exec(hash);
  if (m) return { page: 'work', type: 'manga', workId: decodeURIComponent(m[1]) };

  m = /^illust-work=(.+)$/.exec(hash);
  if (m) return { page: 'work', type: 'illust', workId: decodeURIComponent(m[1]) };

  m = /^manga-chapter=([^:]+):(.+)$/.exec(hash);
  if (m) return { page: 'chapter', type: 'manga', workId: decodeURIComponent(m[1]), chapterId: decodeURIComponent(m[2]) };

  m = /^illust-post=([^:]+):(.+)$/.exec(hash);
  if (m) return { page: 'post', type: 'illust', workId: decodeURIComponent(m[1]), postId: decodeURIComponent(m[2]) };

  return { page: 'home' };
}

function applyRoute() {
  var route = parseRoute();

  // 未登入 → 顯示登入頁
  if (!STATE.token) {
    showPage('login');
    return;
  }

  if (route.page === 'home') {
    goHome(true);
    return;
  }

  if (route.page === 'library') {
    if (isSectionBlocked(route.section)) {
      toast(BLOCKED_MSG, 'error');
      goHome(true);
      return;
    }
    showPage('library');
    renderLibrary(route.section);
    return;
  }

  if (route.page === 'work') {
    openWork(route.workId, true);
    return;
  }

  if (route.page === 'chapter') {
    openChapter(route.workId, route.chapterId, true);
    return;
  }

  if (route.page === 'post') {
    openPost(route.workId, route.postId, true);
    return;
  }

  goHome(true);

// 檢查某個 section 是否整區被鎖（所有作品都 blocked）
function isSectionBlocked(type) {
  var sectionWorks = STATE.works.filter(function(w) { return w.type === type; });
  if (!sectionWorks.length) return false;
  for (var i = 0; i < sectionWorks.length; i++) {
    if (!sectionWorks[i].blocked) return false;
  }
  return true;
}

// 卡片淡入（.reveal → .visible）
function revealIn(el) {
  setTimeout(() => el.querySelectorAll('.reveal').forEach(e => e.classList.add('visible')), 50);
}

function renderGrid(id, works) {
  const el = document.getElementById(id);
  if (!works.length) { el.innerHTML = '<div class="empty-hint">尚無作品</div>'; return; }
  el.innerHTML = works.map(w => {
    if (w.blocked) {
      return `
        <div class="work-card reveal" style="opacity:0.5;cursor:default" title="${BLOCKED_MSG}">
          <div class="work-cover" style="position:relative">
            ${w.cover ? `<img src="${esc(w.cover)}" loading="lazy" style="filter:blur(6px) brightness(0.4)">` : `<div class="work-cover-placeholder">${esc(firstChar(w.title))}</div>`}
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:24px">🔒</div>
          </div>
          <div class="work-info">
            <div class="work-title">${esc(w.title)}</div>
            <div class="work-meta" style="color:var(--danger)">未開通</div>
          </div>
        </div>`;
    }
    return `
    <div class="work-card reveal" onclick="openWork('${w.id}')">
      <div class="work-cover">
        ${w.cover ? `<img src="${esc(w.cover)}" loading="lazy">` : `<div class="work-cover-placeholder">${esc(firstChar(w.title))}</div>`}
      </div>
      <div class="work-info">
        <div class="work-title">${esc(w.title)}</div>
        <div class="work-meta">${w.type === 'manga' ? w.chapters.length + ' 話' : (w.chapters||[]).length + ' 貼文'}</div>
      </div>
    </div>
  `}).join('');
  revealIn(el);
}

function openWork(id, skipRoute) {
  const w = STATE.works.find(x => x.id === id);
  if (!w) return;
  if (w.blocked) { toast(BLOCKED_MSG, 'error'); return; }
  STATE.currentWorkId = id;
  document.getElementById('work-section-label').textContent = w.type === 'manga' ? '漫畫' : '插圖';
  document.getElementById('work-breadcrumb-title').textContent = w.title;
  document.getElementById('work-detail-title').textContent = w.title;
  document.getElementById('work-type-badge').textContent =
    w.type === 'illust' ? '插圖集' : (w.readMode === 'paged' ? '頁漫' : '條漫');

  const cl = document.getElementById('chapter-list');
  if (w.type === 'manga') {
    renderChapterList(cl, w);
  } else {
    renderAlbumList(cl, w);
  }
  showPage('work');
  if (!skipRoute) setRouteHash('#' + (w.type === 'manga' ? 'manga-work=' : 'illust-work=') + encodeURIComponent(id));

function renderChapterList(cl, w) {
  if (!w.chapters || !w.chapters.length) {
    cl.innerHTML = '<div class="empty-hint">尚無話數</div>'; return;
  }
  var chapters = w.chapters.slice().reverse();
  cl.innerHTML = chapters.map((c, i) => {
    const thumb = c.cover || (!c.blocked && c.images && c.images[0] && splitSpoiler(c.images[0]).url) || '';
    const num = String(chapters.length - i).padStart(2,'0');
    if (c.blocked) {
      return `
        <div class="chapter-item reveal" style="opacity:0.5;cursor:default">
          <div class="chapter-thumb">
            ${thumb ? `<img src="${esc(thumb)}" loading="lazy" style="filter:blur(4px) brightness(0.4)">` : `<div class="chapter-thumb-placeholder">🔒</div>`}
          </div>
          <div class="chapter-info">
            <div class="chapter-num">${num}</div>
            <div class="chapter-name">${esc(c.title)}</div>
            <div class="chapter-count" style="color:var(--danger)">${BLOCKED_MSG}</div>
          </div>
        </div>`;
    }
    return `
      <div class="chapter-item reveal" onclick="openChapter('${w.id}','${c.id}')">
        <div class="chapter-thumb">
          ${thumb ? `<img src="${esc(thumb)}" loading="lazy">` : `<div class="chapter-thumb-placeholder">${num}</div>`}
        </div>
        <div class="chapter-info">
          <div class="chapter-num">${num}</div>
          <div class="chapter-name">${esc(c.title)}</div>
          <div class="chapter-count">${(c.images||[]).length} 張</div>
        </div>
      </div>`;
  }).join('');
  revealIn(cl);
}

function renderAlbumList(cl, w) {
  const posts = w.chapters || [];
  if (!posts.length) { cl.innerHTML = '<div class="empty-hint">尚無貼文</div>'; return; }
  cl.innerHTML = '<div class="post-list">' + posts.map((p, i) => {
    if (p.blocked) {
      const coverHtml = p.cover
        ? `<img src="${esc(p.cover)}" loading="lazy" style="filter:blur(4px) brightness(0.4)">`
        : `<div class="post-list-cover-ph">🔒</div>`;
      const title = p.title || '（未命名貼文）';
      return `
        <div class="post-list-item reveal" style="opacity:0.5;cursor:default">
          <div class="post-list-cover">${coverHtml}</div>
          <div class="post-list-body">
            <div class="post-list-title">${esc(title)}</div>
            <div class="post-list-meta" style="color:var(--danger)">${BLOCKED_MSG}</div>
          </div>
        </div>`;
    }
    const coverUrl = p.cover || (p.images && p.images[0]) || '';    const coverHtml = coverUrl
      ? `<img src="${esc(coverUrl)}" loading="lazy">`
      : `<div class="post-list-cover-ph">🖼</div>`;
    // title = first line of caption, or fallback
    const lines = (p.caption || '').split('\n');
    const title = p.title || lines[0] || '（未命名貼文）';
    // excerpt = remaining caption text
    const excerptLines = p.title ? lines : lines.slice(1);
    const excerpt = excerptLines.join(' ').trim();
    return `
      <div class="post-list-item reveal" onclick="openPost('${w.id}','${p.id}')">
        <div class="post-list-cover">${coverHtml}</div>
        <div class="post-list-body">
          <div class="post-list-title">${esc(title)}</div>
          ${excerpt ? `<div class="post-list-excerpt">${esc(excerpt)}</div>` : ''}
          <div class="post-list-meta">${(p.images||[]).length} 張圖片</div>
        </div>
      </div>`;
  }).join('') + '</div>';
  revealIn(cl);
}

function openChapter(workId, chapterId, skipRoute) {
  const w = STATE.works.find(x => x.id === workId);
  if (!w) return;
  const c = w.chapters.find(x => x.id === chapterId);
  if (!c) return;
  if (c.blocked) { toast(BLOCKED_MSG, 'error'); return; }
  if (!c.images || !c.images.length) { toast('此話尚無圖片', 'error'); return; }
  STATE.currentWorkId = workId;
  STATE.viewerSpoilers = c.images.map(function(s) { return splitSpoiler(s).spoiler; });
  STATE.viewerImages = c.images.map(function(s) { return splitSpoiler(s).url; });
  STATE.viewerIndex = 0;
  document.getElementById('viewer-title').textContent = w.title + ' — ' + c.title;
  showPage('viewer');
  setMode(c.readMode || w.readMode || 'strip');
  if (!skipRoute) setRouteHash('#manga-chapter=' + encodeURIComponent(workId) + ':' + encodeURIComponent(chapterId));
}

// VIEWER — ILLUST POST (single post full view)

function openPost(workId, postId, skipRoute) {
  const w = STATE.works.find(x => x.id === workId);
  if (!w) return;
  const p = w.chapters.find(x => x.id === postId);
  if (!p) return;
  if (p.blocked) { toast(BLOCKED_MSG, 'error'); return; }
  STATE.currentWorkId = workId;
  STATE.viewerPosts = [p];
  STATE.viewerImages = p.images || [];
  STATE.viewerIndex = 0;

  showPage('viewer');
  setMode('illust-post');
  if (!skipRoute) setRouteHash('#illust-post=' + encodeURIComponent(workId) + ':' + encodeURIComponent(postId));

function setMode(mode) {
  STATE.viewerMode = mode;
  const label = document.getElementById('viewer-mode-label');
  label.textContent = mode === 'strip' ? '條漫' : mode === 'paged' ? '頁漫' : '';
  const nav = document.getElementById('viewer-nav');
  const content = document.getElementById('viewer-content');
  window.onscroll = null;
  PAGED_UI.exitPaged();

  if (mode === 'strip') {
    nav.classList.remove('hidden');
    content.innerHTML = `<div class="viewer-strip" id="viewer-strip">${
      STATE.viewerImages.map(function(src, i) {
        if (STATE.viewerSpoilers[i]) {
          return '<div class="spoiler-img strip-spoiler" onclick="event.stopPropagation();this.classList.toggle(\'revealed\')"><img class="strip-img" data-src="' + esc(src) + '"><div class="spoiler-cover">點擊顯示</div></div>';
        }
        return '<img class="strip-img" data-src="' + esc(src) + '">';
      }).join('')
    }</div>`;
    bindSequentialReveal(content, '.strip-img');
    loadImagesInOrder(content.querySelectorAll('.strip-img'));
    bindTapToggle(document.getElementById('viewer-strip'), function() {
      document.getElementById('viewer-nav').classList.toggle('hidden');
    });
  } else if (mode === 'paged') {
    nav.classList.remove('hidden');
    renderPaged();
  } else if (mode === 'illust-post') {
    nav.classList.remove('hidden');
    const p = STATE.viewerPosts[0];
    let allImgUrls = p.images || [];
    const body = p.body || '';
    let blocksHtml = '';

    if (body) {
      blocksHtml = parseMd(body, true);
    } else {
      // Legacy: images array + caption text
      const imgs = allImgUrls;
      if (imgs.length === 1) {
        blocksHtml += `<div class="post-block-img"><img data-src="${esc(imgs[0])}"></div>`;
      } else if (imgs.length > 1) {
        const cols = imgs.length === 2 ? 'cols-2' : 'cols-3';
        blocksHtml += `<div class="post-block-imgs ${cols}">` +
          imgs.map((src,i) => `<img data-src="${esc(src)}">`).join('') +
          `</div>`;
      }
      if (p.caption) {
        blocksHtml += `<div class="post-block-text">${esc(p.caption)}</div>`;
      }
    }

    const titleHtml = p.title ? `<div class="post-article-title">${esc(p.title)}</div>` : '';
    const metaHtml = `<div class="post-article-meta">${allImgUrls.length} 張圖片</div>`;
    content.innerHTML = `<div style="padding-top:52px"><div class="post-article">${titleHtml}${metaHtml}<div class="md-content">${blocksHtml}</div></div></div>`;
    bindSequentialReveal(content, '.md-content img');
    loadImagesInOrder(content.querySelectorAll('.md-content img'));
  }
}

// 點一下切換工具列（條漫、頁漫共用）
// 手機只認「短按且沒移動」才算點擊，避免滑動時誤觸；el._wasDragging 也會被頁漫的滑鼠拖曳設定
function bindTapToggle(el, onTap) {
  el.querySelectorAll('img').forEach(img => { img.ondragstart = (e) => e.preventDefault(); });

  el._wasDragging = false;
  el._tapOk = false;

  let tDown = false, tStartX = 0, tStartY = 0, tStartT = 0, tMoved = false;

  el.addEventListener('pointerdown', (e) => {
    if (!IS_MOBILE || e.pointerType != 'touch') return;
    tDown = true;
    tMoved = false;
    el._wasDragging = false;
    el._tapOk = false;
    tStartX = e.clientX;
    tStartY = e.clientY;
    tStartT = Date.now();
    try { el.setPointerCapture(e.pointerId); } catch(_) {}
  }, { passive: true });

  el.addEventListener('pointermove', (e) => {
    if (!tDown || e.pointerType != 'touch') return;
    const dx = e.clientX - tStartX;
    const dy = e.clientY - tStartY;
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
      tMoved = true;
      el._wasDragging = true;
    }
  }, { passive: true });

  el.addEventListener('pointerup', (e) => {
    if (!tDown || e.pointerType != 'touch') return;
    tDown = false;
    const dt = Date.now() - tStartT;
    if (!tMoved && dt < 250) el._tapOk = true;
  }, { passive: true });

  el.addEventListener('pointercancel', (e) => {
    if (e && e.pointerType == 'touch') {
      tDown = false;
      tMoved = false;
      el._wasDragging = true;
      el._tapOk = false;
    }
  }, { passive: true });

  el.addEventListener('click', () => {
    if (el._wasDragging) return;
    if (IS_MOBILE) {
      if (!el._tapOk) return;
      el._tapOk = false;
    }
    onTap();
  });
}

// ══════════════════════════════════════════
// 頁漫 UI 全域控制器
// ══════════════════════════════════════════
const PAGED_UI = {
  timer: null,
  hoverMoveBound: false,
  hoverLeaveBound: false,
  nav:     () => document.getElementById('viewer-nav'),
  counter: () => document.getElementById('paged-counter'),
  arrPrev: () => document.getElementById('paged-arr-prev'),
  arrNext: () => document.getElementById('paged-arr-next'),

  show() {
    clearTimeout(this.timer);
    const nav = this.nav(), ctr = this.counter(), ap = this.arrPrev(), an = this.arrNext();
    if (nav) nav.classList.remove('hidden');
    if (ctr) ctr.classList.remove('arr-hidden');
    if (ap)  ap.classList.remove('arr-hidden');
    if (an)  an.classList.remove('arr-hidden');
    this.timer = setTimeout(() => this.hide(), 2500);
  },

  hide() {
    const nav = this.nav(), ctr = this.counter(), ap = this.arrPrev(), an = this.arrNext();
    if (nav) nav.classList.add('hidden');
    if (ctr) ctr.classList.add('arr-hidden');
    if (ap)  ap.classList.add('arr-hidden');
    if (an)  an.classList.add('arr-hidden');
  },

  syncArrowState() {
    const nav = this.nav(), ap = this.arrPrev(), an = this.arrNext();
    if (!ap || !an) return;
    if (nav && nav.classList.contains('hidden')) {
      ap.classList.add('arr-hidden');
      an.classList.add('arr-hidden');
    } else {
      ap.classList.remove('arr-hidden');
      an.classList.remove('arr-hidden');
    }
  },

  bindArrowHover() {
    if (IS_MOBILE || this.hoverMoveBound) return;

    document.addEventListener('mousemove', (e) => {
      if (STATE.viewerMode != 'paged') return;
      if (!document.getElementById('page-viewer').classList.contains('active')) return;

      const ap = this.arrPrev(), an = this.arrNext();
      if (!ap || !an || ap.style.display == 'none' || an.style.display == 'none') return;

      const inRect = (r) => e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      const rp = ap.getBoundingClientRect();
      const rn = an.getBoundingClientRect();

      if (inRect(rp) || inRect(rn)) {
        ap.classList.remove('arr-hidden');
        an.classList.remove('arr-hidden');
      } else {
        this.syncArrowState();
      }
    });
    this.hoverMoveBound = true;

    if (!this.hoverLeaveBound) {
      document.addEventListener('mouseleave', () => {
        if (STATE.viewerMode == 'paged') this.syncArrowState();
      });
      this.hoverLeaveBound = true;
    }
  },

  updateArrows(idx, total) {
    const ap = this.arrPrev(), an = this.arrNext();
    if (!ap || !an) return;
    ap.classList.toggle('arr-end', idx === 0);
    an.classList.toggle('arr-end', idx === total - 1);
  },

  enterPaged() {
    const ap = this.arrPrev(), an = this.arrNext();
    if (!IS_MOBILE) {
      if (ap) ap.style.display = 'flex';
      if (an) an.style.display = 'flex';
      this.bindArrowHover();
    } else {
      if (ap) ap.style.display = 'none';
      if (an) an.style.display = 'none';
    }
    this.show();
  },

  exitPaged() {
    clearTimeout(this.timer);
    const ap = this.arrPrev(), an = this.arrNext();
    if (ap) ap.style.display = 'none';
    if (an) an.style.display = 'none';
    const nav = this.nav();
    if (nav) nav.classList.remove('hidden');
  }
};

function pagedGetWidth(carousel) {
  const r = carousel.getBoundingClientRect();
  return r.width || window.innerWidth || 1;
}

function pagedScrollToIndex(carousel, idx, smooth) {
  const slide = carousel ? carousel.querySelector(".paged-slide[data-idx='" + idx + "']") : null;
  const w = pagedGetWidth(carousel);
  const target = slide ? slide.offsetLeft : (STATE.viewerImages.length - 1 - idx) * w;
  const behavior = smooth ? 'smooth' : 'auto';
  try { carousel.scrollTo({ left: target, behavior: behavior }); }
  catch (e) { carousel.style.scrollBehavior = behavior; carousel.scrollLeft = target; }
  if (smooth) setTimeout(() => { if (carousel) carousel.style.scrollBehavior = 'auto'; }, 420);
}

function pagedIndexFromScroll(carousel) {
  if (!carousel) return 0;
  const slides = carousel.querySelectorAll('.paged-slide');
  if (!slides || !slides.length) return 0;

  const cr = carousel.getBoundingClientRect();
  const cx = cr.left + cr.width / 2;

  let bestIdx = 0;
  let bestDist = 1e18;

  for (let i = 0; i < slides.length; i++) {
    const r = slides[i].getBoundingClientRect();
    const scx = r.left + r.width / 2;
    const d = Math.abs(scx - cx);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }

  const idx = parseInt(slides[bestIdx].getAttribute('data-idx') || '0', 10);
  return isNaN(idx) ? 0 : idx;
}

function renderPaged() {
  const imgs = STATE.viewerImages;
  const i    = STATE.viewerIndex;
  const content = document.getElementById('viewer-content');

  const slides = imgs.map(function(src, idx) {
    if (STATE.viewerSpoilers[idx]) {
      return '<div class="paged-slide" data-idx="' + idx + '">' +
        '<div class="spoiler-img paged-spoiler" onclick="event.stopPropagation();this.classList.toggle(\'revealed\')">' +
        '<img data-src="' + esc(src) + '">' +
        '<div class="spoiler-cover">點擊顯示</div></div></div>';
    }
    return '<div class="paged-slide" data-idx="' + idx + '">' +
      '<img data-src="' + esc(src) + '">' +
      '</div>';
  }).join('');

  content.innerHTML =
    `<div class="paged-carousel rtl" id="paged-carousel">${slides}</div>` +
    `<div class="paged-counter-overlay arr-hidden" id="paged-counter">${i+1} / ${imgs.length}</div>`;

  const carousel = document.getElementById('paged-carousel');

  bindSequentialReveal(carousel, '.paged-slide img');
  loadImagesInOrder(carousel.querySelectorAll('.paged-slide img'));

  requestAnimationFrame(() => {
    pagedScrollToIndex(carousel, i, false);
    PAGED_UI.enterPaged();
    PAGED_UI.updateArrows(i, imgs.length);
  });

  let raf = 0;
  let tmr = 0;
  carousel.addEventListener('scroll', () => {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      raf = 0;
      const idx = pagedIndexFromScroll(carousel);
      const ctr = document.getElementById('paged-counter');
      if (idx >= 0 && idx < imgs.length) {
        STATE.viewerIndex = idx;
        if (ctr) ctr.textContent = (idx + 1) + ' / ' + imgs.length;
        PAGED_UI.updateArrows(idx, imgs.length);
      }
    });
  }, { passive: true });

  bindTapToggle(carousel, function() {
    if (document.getElementById('viewer-nav').classList.contains('hidden')) PAGED_UI.show();
    else PAGED_UI.hide();
  });

  let dragging = false, startX = 0, startScroll = 0;
  carousel.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    dragging = true;
    carousel._wasDragging = false;
    startX = e.clientX;
    startScroll = carousel.scrollLeft;
    carousel.style.scrollBehavior = 'auto';
    try { carousel.setPointerCapture(e.pointerId); } catch(_) {}
    e.preventDefault();
  }, { passive: false });

  carousel.addEventListener('pointermove', (e) => {
    if (!dragging || e.pointerType === 'touch') return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 6) carousel._wasDragging = true;
    carousel.scrollLeft = startScroll - dx;
    e.preventDefault();
  }, { passive: false });

  const endDrag = (e) => {
    if (!dragging || (e && e.pointerType === 'touch')) return;
    dragging = false;
    const w = pagedGetWidth(carousel);
    const snap = Math.round(carousel.scrollLeft / w);
    carousel.style.scrollBehavior = 'smooth';
    carousel.scrollLeft = snap * w;
    setTimeout(() => { if (carousel) carousel.style.scrollBehavior = 'auto'; }, 420);
    setTimeout(() => { carousel._wasDragging = false; }, 60);
  };

  carousel.addEventListener('pointerup', endDrag);
  carousel.addEventListener('pointercancel', () => { dragging = false; carousel._wasDragging = false; });
}

function pagedNav(dir) {
  const n = STATE.viewerIndex + dir;
  if (n < 0 || n >= STATE.viewerImages.length) return;
  STATE.viewerIndex = n;

  const carousel = document.getElementById('paged-carousel');
  if (!carousel) return;

  pagedScrollToIndex(carousel, n, true);

  const ctr = document.getElementById('paged-counter');
  if (ctr) ctr.textContent = (n + 1) + ' / ' + STATE.viewerImages.length;
  PAGED_UI.updateArrows(n, STATE.viewerImages.length);
}

function goBack(skipRoute) {
  const viewerPage = document.getElementById('page-viewer');
  const workPage = document.getElementById('page-work');

  if (viewerPage && viewerPage.classList.contains('active')) {
    closeViewer(skipRoute);
    return;
  }

  if (workPage && workPage.classList.contains('active')) {
    const w = STATE.works.find(x => x.id === STATE.currentWorkId);
    if (!w) {
      goHome(skipRoute);
      return;
    }
    showPage('library');
    renderLibrary(w.type);
    if (!skipRoute) setRouteHash('#library=' + w.type);
    return;
  }

  goHome(skipRoute);
}

function closeViewer(skipRoute) {
  window.onscroll = null;
  PAGED_UI.exitPaged();
  openWork(STATE.currentWorkId, skipRoute);
}

// ══════════════════════════════════════════
// KEYBOARD
// ══════════════════════════════════════════
function handleKey(e) {
  if (!document.getElementById('page-viewer').classList.contains('active')) return;
  if (STATE.viewerMode === 'paged') {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') pagedNav(-1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') pagedNav(1);
  }
  if (e.key === 'Escape') closeViewer();
}

init();
</script>
